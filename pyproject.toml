[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldmate"
version = "0.1.0"
description = "A passive pentest partner with local evidence and LAN inference"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fieldmate = "fieldmate.__main__:main"

[tool.setuptools.packages.find]
include = ["fieldmate*"]

[tool.setuptools.package-data]
fieldmate = ["static/*"]
