<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10201d"><title>Fieldmate — your pentest partner</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside id="sidebar">
    <a href="#" class="brand" aria-label="Fieldmate home"><img src="/icon.svg" alt=""><span>fieldmate<span class="brand-dot">.</span></span></a>
    <div class="workspace-label">YOUR WORKSPACE <span>LOCAL</span></div>
    <label class="sr-only" for="engagement-select">Engagement</label><select id="engagement-select"><option>No engagements yet</option></select>
    <button class="new-engagement" data-action="new">＋ New engagement</button>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom">
      <div class="side-note"><span class="small-orbit">✳</span><strong>A second set of eyes.</strong><p>Evidence in. Better questions out.<br>You stay in control.</p></div>
      <button class="connection-card" data-action="settings"><span class="status-dot"></span><span><strong id="connection-label">Connect your model</strong><small id="connection-detail">Unsloth Studio · local network</small></span><span>↗</span></button>
      <div class="sidebar-foot">FIELDMATE <span>v0.1 · PASSIVE ASSISTANT</span></div>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <span id="breadcrumb-name">Getting started</span></div><div class="topbar-right"><span class="privacy"><span class="status-dot"></span>Local evidence</span><button class="icon-button" data-action="settings" aria-label="Settings" id="settings-button"></button></div></header>
    <main id="main" tabindex="-1"><div class="loading">Opening your workspace…</div></main>
    <footer class="main-footer"><span><span class="status-dot"></span> Passive by design. Every finding needs evidence.</span><span id="footer-status">Stored on this device</span></footer>
  </div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
